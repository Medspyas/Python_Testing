<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Club points</title>
</head>
<body>
    <h2>Club Points</h2>

    <table border="1">
        <thead>
            <tr>
                <th>Club name</th>
                <th>Available Points</th>
            </tr>
        </thead>
        <tbody>
            {% for club in clubs%}
            <tr>
                <td>{{ club['name'] }}</td>
                <td>{{ club['points'] }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    <br>
    <a href="{{  url_for('index')  }}">Back</a>

        
    
  
</body>
</html>
